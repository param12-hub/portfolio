version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: portfolio_mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: portfolio_cms

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfolio_server
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/portfolio_cms
      - JWT_SECRET=super_secret_jwt_key_apple_linear_stripe_quality_2026
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: portfolio_client
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  mongo_data:
